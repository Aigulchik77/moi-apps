<style>:root{
  --bg:#0a0f1e;--bg2:#0e1628;--card:#121c33;--card2:#16223d;
  --ink:#eef2fb;--ink2:#a9b6d1;--accent:#a78bfa;--accent2:#7c3aed;
  --gold:#f5c06b;--green:#06d6a0;--red:#f43f5e;--line:rgba(167,139,250,.2);--soft:rgba(167,139,250,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Manrope',sans-serif;line-height:1.6;min-height:100vh}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
header{padding:54px 0 30px;text-align:center}
.kicker{display:inline-block;color:var(--accent);letter-spacing:.3em;text-transform:uppercase;font-size:12px;font-weight:700;margin-bottom:16px}
h1{font-family:'Playfair Display',serif;font-size:clamp(28px,5vw,46px);font-weight:600;line-height:1.12}
header p{color:var(--ink2);max-width:60ch;margin:14px auto 0;font-weight:300}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding-bottom:40px}
.lchip{display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 10px;cursor:pointer;transition:transform .12s,border-color .15s,background .15s}
.lchip:hover{transform:translateY(-3px);border-color:var(--accent);background:var(--soft)}
.lchip .fl{font-size:30px}
.lchip .ln{font-weight:800;font-size:15px}
.lchip .lsub{font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.08em}
#game{margin-top:6px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px}
.hearts{font-size:1.15rem;letter-spacing:2px}
.score{font-weight:800;color:var(--gold)}
.streak{font-size:.82rem;color:var(--ink2)}
.prog-bar{height:8px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden;margin-bottom:16px}
.prog-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:999px;transition:width .25s}
.word-card{background:linear-gradient(140deg,var(--bg2),var(--card2));border:1px solid var(--line);border-radius:18px;padding:26px 20px;text-align:center;margin-bottom:16px}
.direction{font-size:.78rem;color:var(--ink2);text-transform:uppercase;letter-spacing:1px}
.word-big{font-size:clamp(1.5rem,6vw,2.1rem);margin-top:8px;font-weight:800;word-break:break-word}
.word-tran{font-size:.95rem;color:var(--accent);margin-top:6px;font-style:italic}
.word-topic{margin-top:10px}
.tag{display:inline-block;background:rgba(167,139,250,.18);border:1px solid rgba(167,139,250,.4);color:#d6c8fa;font-size:.72rem;padding:3px 11px;border-radius:999px}
.spk{display:inline-flex;align-items:center;gap:8px;background:transparent;border:1px solid var(--line);color:var(--accent);font-family:inherit;font-weight:700;font-size:13px;padding:9px 18px;border-radius:999px;cursor:pointer;margin-top:14px;transition:background .2s,border-color .2s}
.spk:hover{background:var(--soft);border-color:var(--accent)}
.spk.speaking{background:var(--accent);color:#081226;border-color:var(--accent)}
.answers{display:grid;grid-template-columns:1fr;gap:10px}
.answer{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-family:inherit;font-size:1rem;color:var(--ink);cursor:pointer;transition:transform .08s,background .15s,border-color .15s}
.answer:hover:not(:disabled){transform:translateY(-2px);background:var(--soft)}
.answer:disabled{cursor:default}
.answer.good{background:rgba(6,214,160,.18);border-color:var(--green)}
.answer.bad{background:rgba(244,63,94,.18);border-color:var(--red)}
.answer .atr{display:block;font-size:.78rem;color:var(--ink2);font-style:italic}
.feedback{text-align:center;margin-top:14px;min-height:24px;font-weight:700}
.feedback.good{color:var(--green)}
.feedback.bad{color:var(--red)}
.results{text-align:center;padding:40px 0}
.big-num{font-size:clamp(2.4rem,9vw,4rem);font-weight:800;font-family:'Playfair Display',serif}
.results .rsub{color:var(--ink2);margin-top:6px}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:22px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 20px;min-width:110px}
.stat b{display:block;font-size:1.3rem;color:var(--gold)}
.stat span{font-size:.72rem;color:var(--ink2);text-transform:uppercase;letter-spacing:.08em}
.mistakes{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:18px auto;max-width:520px}
.mistakes h3{font-size:.85rem;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.mistake{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed rgba(255,255,255,.08)}
.mistake:last-child{border-bottom:none}
.mistake .q{font-weight:700}
.mistake .a{color:var(--green);font-weight:700}
.btnrow{display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.gbtn{font-family:inherit;font-weight:800;font-size:.95rem;padding:13px 26px;border-radius:999px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink);transition:background .15s,border-color .15s}
.gbtn:hover{border-color:var(--accent);background:var(--soft)}
.gbtn.prime{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0d1020;border:none}
.gbtn.prime:hover{opacity:.92;background:linear-gradient(135deg,var(--accent),var(--accent2))}
footer{padding:44px 0 60px;text-align:center;color:var(--ink2);font-size:13px}
footer span{color:var(--accent)}
.install{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:999;display:none;align-items:center;gap:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0d1020;border:none;border-radius:999px;padding:13px 24px;font-weight:800;font-size:.95rem;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.45);font-family:'Manrope',sans-serif}
@media print{body{background:#fff;color:#000}.answer{border-color:#ccc}}</style>

  en:{flag:"🇬🇧",name:"Английский",voice:"en-GB",native:"English"},
  de:{flag:"🇩🇪",name:"Немецкий",voice:"de-DE",native:"Deutsch"},
  es:{flag:"🇪🇸",name:"Испанский",voice:"es-ES",native:"Español"},

  fr:{flag:"🇫🇷",name:"Французский",voice:"fr-FR",native:"Français"},
  tr:{flag:"🇹🇷",name:"Турецкий",voice:"tr-TR",native:"Türkçe"},
  no:{flag:"🇳🇴",name:"Норвежский",voice:"nb-NO",native:"Norsk"},
  hi:{flag:"🇮🇳",name:"Хинди",voice:"hi-IN",native:"हिन्दी"},
  zh:{flag:"🇨🇳",name:"Китайский",voice:"zh-CN",native:"中文"},
  ar:{flag:"🇸🇦",name:"Арабский",voice:"ar-SA",native:"العربية"}
};
let audio = null;
let state = null;
const TOTAL = 12;
const gameEl = document.getElementById('game');

function stop(){
  if (audio){ audio.pause(); audio = null; }
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  document.querySelectorAll('.spk.speaking').forEach(b => { b.dataset.on=''; b.classList.remove('speaking'); });
}
function gtUrl(lang, text){
  const q = encodeURIComponent(text);
  return 'https://translate.google.com/translate_tts?ie=UTF-8&q=' + q + '&tl=' + lang + '&client=tw-ob&total=1&idx=0';
}
function playFromGoogle(lang, text, btn){
  audio = new Audio(gtUrl(lang, text));
  audio.crossOrigin = 'anonymous';
  if (btn){ btn.dataset.on='1'; btn.classList.add('speaking'); }
  audio.onended = () => { if (btn){ btn.dataset.on=''; btn.classList.remove('speaking'); } audio = null; };
  audio.onerror = () => { if (btn){ btn.dataset.on=''; btn.classList.remove('speaking'); } tryLocal(lang, text, btn); };
  audio.play().catch(() => { if (btn){ btn.dataset.on=''; btn.classList.remove('speaking'); } tryLocal(lang, text, btn); });
}
function tryLocal(lang, text, btn){
  if (!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = META[lang] ? META[lang].voice : lang;
  const voices = window.speechSynthesis.getVoices();
  const v = voices.find(x => x.lang && x.lang.toLowerCase().startsWith((META[lang]?META[lang].voice:lang).toLowerCase().slice(0,2))) || null;
  if (v) u.voice = v;
  u.rate = 0.85;
  if (btn){ btn.dataset.on='1'; btn.classList.add('speaking'); }
  u.onend = () => { if (btn){ btn.dataset.on=''; btn.classList.remove('speaking'); } };
  u.onerror = () => { if (btn){ btn.dataset.on=''; btn.classList.remove('speaking'); } };
  window.speechSynthesis.speak(u);
}
function speak(lang, text, btn){
  stop();
  if (btn && btn.dataset.on) { btn.dataset.on=''; btn.classList.remove('speaking'); return; }
  playFromGoogle(lang, text, btn);
}
function shuffle(a){
  const arr = a.slice();
  for (let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function picker(){
  const codes = Object.keys(LANGS);
  let html = '<div class="pick-grid">';
  codes.forEach(c => {
    const m = META[c] || {flag:"🌐",name:c,sub:c};
    html += '<button class="lchip" onclick="pick(\\\''+c+'\\\')"><span class="fl">'+m.flag+'</span><span class="ln">'+m.name+'</span><span class="lsub">'+c.toUpperCase()+'</span></button>';
  });
  html += '</div>';
  gameEl.innerHTML = html;
}
function flatten(lang){
  const out = [];
  for (const t in LANGS[lang]){
    LANGS[lang][t].forEach(w => out.push({ru:w.ru, tg:w.tg, tr:w.tr||'', topic:t}));
  }
  return out;
}
function pick(c){
  const wlist = flatten(c);
  state = {
    lang: c, dir: 0, wlist: wlist,
    qs: [], qi: 0, score: 0, lives: 3, streak: 0,
    mistakes: [], started: false
  };
  const targets = shuffle(wlist).slice(0, TOTAL);
  targets.forEach(word => {
    const options = [word];
    while (options.length < 4){
      const cand = wlist[Math.floor(Math.random() * wlist.length)];
      if (!options.some(o => o.tg === cand.tg)) options.push(cand);
    }
    state.qs.push({ word: word, options: shuffle(options) });
  });
  render();
}
function render(){
  const s = state;
  const q = s.qs[s.qi];
  const toTg = s.dir === 0;
  const m = META[s.lang];
  let html = '<div class="topbar"><div class="hearts" id="hearts" style="color:var(--accent)">'+('❤️'.repeat(Math.max(0,s.lives)))+('🤍'.repeat(Math.max(0,3-s.lives)))+'</div><div class="score">⭐ '+s.score+'</div></div>';
  html += '<div class="streak" style="text-align:center;margin-bottom:6px">🔥 серия: '+s.streak+' · '+(toTg?'<b>'+m.flag+' → 🇷🇺</b>':'🇷🇺 → <b>'+m.flag+'</b>')+' <button class="gbtn" style="padding:5px 14px;font-size:.75rem" onclick="toggleDir()">↕</button></div>';
  html += '<div class="prog-bar"><div class="prog-fill" style="width:'+(s.qi/TOTAL*100)+'%"></div></div>';
  html += '<div class="word-card">';
  html += '<div class="direction">'+(toTg ? m.native+' → русский' : 'русский → '+m.native)+' · '+(s.qi+1)+' / '+TOTAL+'</div>';
  html += '<div class="word-big">'+esc(toTg ? q.word.tg : q.word.ru)+'</div>';
  if (toTg && q.word.tr) html += '<div class="word-tran">'+esc(q.word.tr)+'</div>';
  html += '<div class="word-topic"><span class="tag">'+esc(q.word.topic)+'</span></div>';
  html += '<button class="spk" onclick="sayWord()">🔊 Прослушать</button>';
  html += '</div>';
  html += '<div class="answers">';
  q.options.forEach((opt, i) => {
    const label = toTg ? opt.ru : opt.tg;
    const sub = (!toTg && opt.tr) ? opt.tr : '';
    html += '<button class="answer" id="ans'+i+'" onclick="answer('+i+')"><span>'+(toTg||i>=0?esc(label):esc(label))+'</span>'+((!toTg && sub)?'<span class="atr">'+esc(sub)+'</span>':'')+'</button>';
  });
  html += '</div><div class="feedback" id="fb"></div>';
  gameEl.innerHTML = html;
}
function sayWord(){
  const s = state; if (!s) return;
  const q = s.qs[s.qi];
  const toTg = s.dir === 0;
  speak(s.lang, toTg ? q.word.tg : q.word.ru, event.target);
}
function toggleDir(){
  if (!state) return;
  state.dir = 1 - state.dir;
  render();
}
function answer(i){
  const s = state;
  const q = s.qs[s.qi];
  const qEl = document.querySelectorAll('.answer');
  const fb = document.getElementById('fb');
  const correct = s.dir === 0 ? q.word.ru : q.word.tg;
  const picked = s.dir === 0 ? q.options[i].ru : q.options[i].tg;
  qEl.forEach(b => b.disabled = true);
  const correctIdx = q.options.findIndex(o => (s.dir===0?o.ru:o.tg) === correct);
  qEl[correctIdx].classList.add('good');
  if (i === correctIdx){
    s.score += 10 + s.streak * 2;
    s.streak++;
    fb.className = 'feedback good';
    fb.textContent = '✅ Верно!';
  } else {
    qEl[i].classList.add('bad');
    s.lives--;
    s.streak = 0;
    fb.className = 'feedback bad';
    fb.textContent = '❌ Верно: ' + correct;
    s.mistakes.push({ q: s.dir===0?q.word.tg:(q.word.ru+(q.word.tr?' ('+q.word.tr+')':'')), a: correct, pg: (s.dir===0?q.word.ru:q.word.tg+(q.word.tr?' ('+q.word.tr+')':'')) });
  }
  setTimeout(() => {
    s.qi++;
    if (s.lives <= 0 || s.qi >= s.qs.length) { results(); return; }
    render();
  }, 1100);
}
function results(){
  const s = state;
  const m = META[s.lang];
  const total = s.qs.length;
  const accuracy = Math.round((s.score / (total * 22)) * 100);
  let html = '<div class="results">';
  html += '<div class="big-num">'+s.score+' ⭐</div>';
  html += '<div class="rsub">'+m.flag+' '+m.name+' · '+s.wlist.length+' слов в словаре</div>';
  html += '<div class="stats"><div class="stat"><b>'+s.score+'</b><span>очков</span></div><div class="stat"><b>'+total+'</b><span>вопросов</span></div><div class="stat"><b style="color:var(--accent)">'+s.mistakes.length+'</b><span>ошибок</span></div></div>';
  if (s.mistakes.length){
    html += '<div class="mistakes"><h3>Повтори</h3>';
    s.mistakes.forEach(mm => {
      html += '<div class="mistake"><span class="q">'+esc(mm.q)+'</span><span class="a">'+esc(mm.a)+'</span></div>';
    });
    html += '</div>';
  }
  html += '<div class="btnrow"><button class="gbtn prime" onclick="pick(\''+s.lang+'\')">🔁 Играть ещё</button><button class="gbtn" onclick="picker()">🌐 Выбрать язык</button></div>';
  html += '</div>';
  gameEl.innerHTML = html;
}
if ('speechSynthesis' in window) { window.speechSynthesis.onvoiceschanged = () => {}; }
picker();
