<!DOCTYPE html>
<html lang="ru">

<meta name="mobile-web-app-capable" content="yes">

<title>Хинди: обучающая игра</title>
<style>
  :root {
    --bg1: #1a1a2e;
    --bg2: #16213e;
    --bg3: #0f3460;
    --accent: #e94560;
    --gold: #ffd166;
    --green: #06d6a0;
    --card: rgba(255,255,255,0.08);
    --text: #f0f0f5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, var(--bg1), var(--bg3));
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .app {
    width: 100%;
    max-width: 560px;
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  h1 { font-size: 1.4rem; text-align: center; margin-bottom: 4px; }
  .subtitle { text-align: center; color: rgba(255,255,255,0.65); font-size: .9rem; margin-bottom: 20px; }
  .dev { font-family: 'Nirmala UI', 'Segoe UI', sans-serif; }
  .hidden { display: none !important; }

  /* Language switcher */
  .lang-switch { display: flex; justify-content: center; gap: 8px; margin-bottom: 18px; }
  .lbtn {
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.08);
    color: var(--text);
    padding: 7px 14px;
    border-radius: 999px;
    font-size: .85rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, border-color .15s;
    font-family: inherit;
  }
  .lbtn:hover { background: rgba(255,255,255,0.16); }
  .lbtn.active { background: var(--accent); border-color: var(--accent); }

  /* Screen: menu */
  .level-card {
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: transform .15s, background .15s;
  }
  .level-card:hover { transform: translateY(-2px); background: rgba(255,255,255,0.14); }
  .level-card .lvl-name { font-weight: 700; font-size: 1.05rem; }
  .level-card .lvl-desc { color: rgba(255,255,255,0.7); font-size: .85rem; margin-top: 4px; }
  .level-card .lvl-tags { margin-top: 8px; }
  .tag {
    display: inline-block; background: rgba(233,69,96,.25);
    border: 1px solid rgba(233,69,96,.5);
    color: #ffb3c1;
    font-size: .75rem; padding: 2px 10px; border-radius: 999px; margin: 2px 4px 2px 0;
  }

  /* Screen: game */
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; }
  .hearts { font-size: 1.1rem; letter-spacing: 2px; }
  .score { font-weight: 700; color: var(--gold); }
  .streak { font-size: .8rem; color: rgba(255,255,255,0.7); }
  .prog-bar { height: 8px; background: rgba(255,255,255,0.12); border-radius: 999px; overflow: hidden; margin-bottom: 16px; }
  .prog-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--gold)); border-radius: 999px; transition: width .3s; }

  .word-card {
    background: linear-gradient(140deg, var(--bg2), var(--bg3));
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 16px;
    padding: 28px 20px;
    text-align: center;
    margin-bottom: 16px;
  }
  .direction { font-size: .8rem; color: rgba(255,255,255,0.6); text-transform: uppercase; letter-spacing: 1px; }
  .word-big { font-size: 2.4rem; margin-top: 8px; word-break: break-word; }
  .word-tran { font-size: .95rem; color: var(--gold); margin-top: 6px; font-style: italic; }
  .word-topic { margin-top: 10px; }
  .timer { height: 6px; background: rgba(255,255,255,0.12); border-radius: 999px; margin-top: 14px; overflow: hidden; }
  .timer-fill { height: 100%; width: 100%; background: var(--green); transition: width .1s linear; }

  .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .answer {
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 16px 10px;
    font-size: 1rem;
    color: var(--text);
    cursor: pointer;
    transition: transform .1s, background .15s, border-color .15s;
    min-height: 64px;
  }
  .answer:hover:not(:disabled) { transform: translateY(-2px); background: rgba(255,255,255,0.14); }
  .answer.correct { background: rgba(6,214,160,0.25); border-color: var(--green); }
  .answer.wrong { background: rgba(233,69,96,0.3); border-color: var(--accent); }
  .answer:disabled { cursor: default; }

  .feedback { text-align: center; min-height: 40px; margin-top: 12px; font-size: .95rem; }
  .feedback.ok { color: var(--green); }
  .feedback.no { color: #ff8095; }

  /* Screen: result */
  .result-big { font-size: 3rem; text-align: center; margin: 10px 0; }
  .result-stats { text-align: center; margin-bottom: 16px; }
  .result-stats .stat { display: inline-block; margin: 0 12px; font-size: .95rem; }
  .result-stats .stat b { display: block; font-size: 1.4rem; color: var(--gold); }
  .mistakes { margin-top: 16px; }
  .mistakes h3 { font-size: .95rem; margin-bottom: 8px; color: rgba(255,255,255,0.8); }
  .mistake-item {
    background: var(--card); border-radius: 10px; padding: 8px 12px;
    margin-bottom: 6px; font-size: .9rem;
  }
  .mistake-item .dev { color: var(--gold); }

  .btn {
    display: block; width: 100%;
    padding: 14px; border: none; border-radius: 12px;
    font-size: 1rem; font-weight: 700; cursor: pointer;
    background: linear-gradient(90deg, var(--accent), var(--bg3));
    color: #fff;
    margin-top: 14px;
    transition: transform .1s, opacity .15s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(0); }
  .btn.secondary { background: rgba(255,255,255,0.12); }
  .install {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 16px; z-index: 999;
    display: none; align-items: center; gap: 10px;
    background: linear-gradient(90deg, var(--accent), var(--bg3)); color: #fff;
    border: none; border-radius: 999px; padding: 13px 24px; font-weight: 700; font-size: .95rem;
    cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,.45);
    font-family: inherit;
  }
</style>

function t(key, vars) {
  let s = (I18N[lang] && I18N[lang][key]) != null ? I18N[lang][key] : (I18N.ru[key] || key);
  if (vars) for (const k in vars) s = s.split("{" + k + "}").join(vars[k]);
  return s;
}
function tn(key) { return (TOPICS[key] && TOPICS[key][lang]) ? TOPICS[key][lang] : key; }
function setLang(l) {
  lang = l;
  try { localStorage.setItem("hlang", l); } catch(e) {}
  document.querySelectorAll(".lbtn").forEach(b => b.classList.toggle("active", b.dataset.lang === l));
  renderMenu();
}
function syncLangBtns() {
  document.querySelectorAll(".lbtn").forEach(b => b.classList.toggle("active", b.dataset.lang === lang));
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function poolFor(level) {
  if (level.tags[0] === "Все темы") return Object.values(DATA).flat();
  const set = [];
  level.tags.forEach(t => set.push(...DATA[t]));
  return set;
}

function renderMenu() {
  clearInterval(timerId);
  let html = `<h1>${t("title")}</h1>
    <p class="subtitle">${t("subtitle")}</p>`;
  LEVELS.forEach((lvl, i) => {
    const tags = lvl.tags.map(tg => `<span class="tag">${tg === "Все темы" ? t("all_topics") : tn(tg)}</span>`).join("");
    html += `<div class="level-card" onclick="startLevel(${i})">
      <div class="lvl-name">${t(lvl.name[0])}</div>
      <div class="lvl-desc">${t(lvl.name[1])}</div>
      <div class="lvl-tags">${tags}</div>
    </div>`;
  });
  html += `<button class="btn secondary" onclick="toggleDir()" id="dirBtn"></button>`;
  app.innerHTML = html;
  updateDirBtn();
  syncLangBtns();
}

function updateDirBtn() {
  const b = document.getElementById("dirBtn");
  if (!b) return;
  b.textContent = state && state.dir === "nat"
    ? t("dir_nat", { l: LANG_NAMES[lang] })
    : t("dir_hi", { l: LANG_NAMES[lang] });
}

function toggleDir() {
  if (!state) return;
  state.dir = state.dir === "hi" ? "nat" : "hi";
  updateDirBtn();
}

function startLevel(idx) {
  state = {
    level: LEVELS[idx],
    dir: "hi",
    qs: [],
    qIndex: 0,
    score: 0,
    lives: 3,
    streak: 0,
    mistakes: []
  };
  const pool = poolFor(LEVELS[idx]);
  const targets = shuffle(pool).slice(0, LEVELS[idx].questions);
  const allWords = pool;
  targets.forEach(word => {
    const options = [word];
    while (options.length < 4) {
      const c = allWords[Math.floor(Math.random() * allWords.length)];
      if (!options.some(o => o.hi === c.hi)) options.push(c);
    }
    state.qs.push({ word, options: shuffle(options) });
  });
  renderGame();
}

function renderGame() {
  clearInterval(timerId);
  const s = state;
  const lvl = s.level;
  const q = s.qs[s.qIndex];
  const progress = (s.qIndex / lvl.questions) * 100;
  const toHi = s.dir === "hi";

  let html = `
    <div class="topbar">
      <div class="hearts" id="hearts">${"❤️".repeat(Math.max(0, s.lives))}${"🤍".repeat(Math.max(0, 3 - s.lives))}</div>
      <div class="streak">🔥 ${s.streak}</div>
      <div class="score" id="score">⭐ ${s.score}</div>
    </div>
    <div class="prog-bar"><div class="prog-fill" id="prog" style="width:${progress}%"></div></div>
    <div class="word-card">
      <div class="direction">${toHi ? t("dir_hi_short", { l: LANG_NAMES[lang] }) : t("dir_nat_short", { l: LANG_NAMES[lang] })} · ${s.qIndex + 1} / ${lvl.questions}</div>
      <div class="word-big dev">${toHi ? q.word.hi : q.word[lang]}</div>
      ${toHi ? `<div class="word-tran">${q.word.tr}</div>` : ""}
      <div class="word-topic"><span class="tag">${topicOf(q.word) === "Все темы" ? t("all_topics") : tn(topicOf(q.word))}</span></div>
      ${lvl.time ? `<div class="timer"><div class="timer-fill" id="timer"></div></div>` : ""}
    </div>
    <div class="answers">`;
  q.options.forEach((opt, i) => {
    const label = toHi ? opt[lang] : opt.hi;
    html += `<button class="answer" id="ans${i}" onclick="answer(${i})">${label}</button>`;
  });
  html += `</div>
    <div class="feedback" id="fb"></div>`;
  app.innerHTML = html;

  if (lvl.time) startTimer();
}

function topicOf(word) {
  for (const t in DATA) if (DATA[t].some(w => w.hi === word.hi)) return t;
  return "";
}

function startTimer() {
  const total = state.level.time;
  let left = total;
  const fill = document.getElementById("timer");
  const tick = () => {
    left -= 0.1;
    if (fill) fill.style.width = (left / total) * 100 + "%";
    if (left <= 0) {
      clearInterval(timerId);
      resolve(false);
    }
  };
  timerId = setInterval(tick, 100);
}

function answer(i) {
  clearInterval(timerId);
  resolve(i);
}

function resolve(pickedIndex) {
  const s = state;
  const q = s.qs[s.qIndex];
  const picked = typeof pickedIndex === "number" ? q.options[pickedIndex] : null;
  const correct = q.word;
  const ok = picked && picked.hi === correct.hi;
  const toHi = s.dir === "hi";

  q.options.forEach((opt, idx) => {
    const el = document.getElementById("ans" + idx);
    if (!el) return;
    el.disabled = true;
    if (opt.hi === correct.hi) el.classList.add("correct");
    else if (picked && idx === pickedIndex) el.classList.add("wrong");
  });

  const fb = document.getElementById("fb");
  if (ok) {
    s.streak++;
    s.score += 10 + Math.min(10, s.streak * 2);
    fb.className = "feedback ok";
    fb.innerHTML = `${t("ok")} ${s.streak >= 2 ? t("streak", { n: s.streak }) : ""}`;
  } else {
    s.lives--;
    s.streak = 0;
    fb.className = "feedback no";
    const shown = toHi ? correct[lang] : `${correct.hi} (${correct.tr})`;
    fb.innerHTML = picked
      ? `${t("wrong")} <b>${shown}</b>`
      : `${t("timeout")} <b>${shown}</b>`;
    s.mistakes.push({ q, correct, picked });
  }

  const hearts = document.getElementById("hearts");
  if (hearts) hearts.textContent = "❤️".repeat(Math.max(0, s.lives)) + "🤍".repeat(Math.max(0, 3 - s.lives));
  const scoreEl = document.getElementById("score");
  if (scoreEl) scoreEl.textContent = "⭐ " + s.score;

  setTimeout(() => {
    if (s.lives <= 0) return renderResult();
    s.qIndex++;
    if (s.qIndex >= s.level.questions) renderResult();
    else renderGame();
  }, 1200);
}

function renderResult() {
  clearInterval(timerId);
  const s = state;
  const total = s.level.questions;
  const correctCount = total - s.mistakes.length;
  const pct = Math.round((correctCount / total) * 100);
  const emoji = pct >= 80 ? "🏆" : pct >= 50 ? "🎉" : "💪";

  let html = `<div class="result-big">${emoji}</div>
    <div class="result-stats">
      <span class="stat"><b>${correctCount}/${total}</b>${t("stat_correct")}</span>
      <span class="stat"><b>${pct}%</b>${t("stat_accuracy")}</span>
      <span class="stat"><b>${s.score}</b>${t("stat_points")}</span>
    </div>`;
  if (s.mistakes.length) {
    html += `<div class="mistakes"><h3>${t("mistakes_title")}</h3>`;
    s.mistakes.forEach(({ correct, picked }) => {
      html += `<div class="mistake-item">${correct.hi} <span class="dev">(${correct.tr})</span> = ${correct[lang]}
        ${picked ? `<div style="font-size:.8rem;color:#ff8095">${t("you_picked")} ${picked[lang]}</div>` : ""}</div>`;
    });
    html += `</div>`;
  }
  html += `<button class="btn" onclick="startLevel(${LEVELS.indexOf(s.level)})">${t("play_again")}</button>
    <button class="btn secondary" onclick="renderMenu()">${t("to_menu")}</button>`;
  app.innerHTML = html;
}

syncLangBtns();
renderMenu();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
var deferredPrompt = null;
window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault();
  deferredPrompt = e;
  var b = document.getElementById('installBtn');
  if (b) b.style.display = 'block';
});
function installApp() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt = null;
  var b = document.getElementById('installBtn');
  if (b) b.style.display = 'none';
}
window.addEventListener('appinstalled', function () {
  var b = document.getElementById('installBtn');
  if (b) b.style.display = 'none';
});
</script></body>
</html>
